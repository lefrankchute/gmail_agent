services:
  postgres:
    image: postgres:16-alpine
    container_name: gmail-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gmail_agent
      POSTGRES_USER: gmail_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gmail-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
